services:
  - type: web
    name: signconnect
    runtime: python
    buildCommand: |
      pip install --upgrade pip
      pip install tensorflow opencv-python numpy scikit-learn joblib
      npm install
      npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false